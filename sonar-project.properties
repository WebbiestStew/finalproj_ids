# Valores por defecto de SonarCloud para el repo WebbiestStew/finalproj_ids; verifica que
# coincidan con los que muestra tu proyecto (Information -> Project Key / Organization Key).
sonar.projectKey=webbieststew_finalproj_ids
sonar.organization=webbieststew

sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**
sonar.exclusions=**/node_modules/**,**/coverage/**,backend/data/**,frontend/dist/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
