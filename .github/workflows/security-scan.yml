name: Seguridad y calidad de codigo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  zap-baseline:
    name: OWASP ZAP baseline scan (XSS / SQLi / headers)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Levantar el servidor para el escaneo
        working-directory: backend
        env:
          JWT_SECRET: zap-scan-secret
          DB_PATH: ':memory:'
          PORT: '3000'
        run: |
          nohup node src/server.js > server.log 2>&1 &
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/health && break
            sleep 1
          done

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
          rules_file_name: '.zap/rules.tsv'
          artifact_name: 'zap-baseline-report'

  code-quality:
    name: SonarCloud (deuda tecnica / code smells)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Sin SONAR_TOKEN el analisis se omite
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN no esta configurado; se omite SonarCloud (ver docs/reportes/README.md)."

      - uses: actions/checkout@v4
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cobertura del backend (para que Sonar la importe)
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: backend
        run: |
          npm ci
          npm run test:coverage

      - name: Cobertura del frontend (para que Sonar la importe)
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_HOST_URL: https://sonarcloud.io

      # Espera a que SonarCloud termine de procesar el analisis y guarda sus metricas, el
      # resultado del quality gate y los hallazgos abiertos como reporte (artefacto + resumen).
      - name: Exportar reporte de SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          set -euo pipefail
          api=https://sonarcloud.io/api
          task_url=$(grep '^ceTaskUrl=' .scannerwork/report-task.txt | cut -d= -f2-)
          key=$(grep '^projectKey=' .scannerwork/report-task.txt | cut -d= -f2-)
          for i in $(seq 1 36); do
            st=$(curl -sf -u "$SONAR_TOKEN:" "$task_url" | jq -r .task.status)
            [ "$st" = "SUCCESS" ] && break
            sleep 5
          done
          mkdir -p sonar-report
          metrics=bugs,vulnerabilities,code_smells,sqale_index,sqale_rating,reliability_rating,security_rating,coverage,duplicated_lines_density,ncloc,security_hotspots
          curl -sf -u "$SONAR_TOKEN:" "$api/measures/component?component=$key&metricKeys=$metrics" > sonar-report/metricas.json
          curl -sf -u "$SONAR_TOKEN:" "$api/qualitygates/project_status?projectKey=$key" > sonar-report/quality-gate.json
          curl -sf -u "$SONAR_TOKEN:" "$api/issues/search?componentKeys=$key&resolved=false&ps=100" > sonar-report/hallazgos.json
          {
            echo "## Reporte de SonarCloud ($key)"
            echo
            echo "Quality gate: $(jq -r .projectStatus.status sonar-report/quality-gate.json)"
            echo
            echo "| Metrica | Valor |"
            echo "|---|---|"
            jq -r '.component.measures[] | "| \(.metric) | \(.value) |"' sonar-report/metricas.json
            echo
            echo "### Hallazgos abiertos"
            jq -r '.issues[] | "- [\(.type)/\(.severity)] \(.rule) en \(.component | sub("^[^:]*:";"")):\(.line // "-"): \(.message)"' sonar-report/hallazgos.json
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sonarcloud-report
          path: sonar-report
