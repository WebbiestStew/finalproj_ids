name: CI/CD - DAuto Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    name: Lint, unit tests y cobertura (>=80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoría de dependencias (producción)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (ESLint + sonarjs)
        run: npm run lint

      - name: Duplicación de código (jscpd)
        run: npm run duplication

      - name: Pruebas unitarias con cobertura
        run: npm run test:coverage

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage

  frontend:
    name: Frontend - lint, pruebas, cobertura y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoría de dependencias (producción)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (oxlint)
        run: npm run lint

      - name: Pruebas con cobertura
        run: npm run test:coverage

      - name: Build de producción
        run: npm run build

      - name: Publicar reporte de cobertura del frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage

  build-and-push:
    name: Build y push de la imagen Docker (app completa, GHCR)
    needs: [lint-and-test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Calcular nombre de imagen en minusculas
        run: echo "IMAGE_NAME=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push (Dockerfile de la raiz, API y frontend en una sola imagen)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-test-env:
    name: Despliegue automatico a entorno de prueba (smoke test de la app completa)
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: .
    steps:
      - name: Calcular nombre de imagen en minusculas
        run: echo "IMAGE_NAME=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ejecutar la imagen publicada en un entorno de prueba efimero
        run: |
          docker run -d --name dauto-test \
            -p 3000:3000 \
            -e JWT_SECRET=ci-smoke-test-secret \
            -e ADMIN_EMAIL=admin@ci.test \
            -e ADMIN_PASSWORD=ci-admin-password-1 \
            -e SEED_DEMO=true \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Esperar a que el servicio este listo
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/health; then exit 0; fi
            sleep 2
          done
          echo "El servicio no respondio a tiempo" && docker logs dauto-test && exit 1

      - name: El frontend se sirve desde la misma imagen (y sus rutas sobreviven a un refresco)
        run: |
          curl -sf http://localhost:3000/ | grep -q 'id="root"'
          curl -sf -H "Accept: text/html" http://localhost:3000/catalogo/7 | grep -q 'id="root"'

      - name: El catalogo publico responde con los datos demo
        run: |
          curl -sf http://localhost:3000/api/vehicles | grep -q '"total":12'

      - name: Flujo de registro y de login del administrador creado desde variables de entorno
        run: |
          curl -sf -X POST http://localhost:3000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"Smoke Test","email":"smoke@example.com","password":"password123","role":"comprador"}'
          curl -sf -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@ci.test","password":"ci-admin-password-1"}' | grep -q '"token"'

      - name: Las cuentas demo NO son accesibles sin DEMO_PASSWORD (seguro por defecto)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"contacto@autosnorte.com","password":"demo-password-123"}')
          test "$code" = "401"

      - name: Logs del contenedor
        if: always()
        run: docker logs dauto-test

  deploy-hosting:
    name: Despliegue al hosting (solo si esta configurado)
    needs: deploy-test-env
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      # Configura el secreto RENDER_DEPLOY_HOOK (ver docs/despliegue.md). Sin el, este paso
      # se salta y el pipeline queda en verde: el despliegue real es opcional.
      - name: Disparar el despliegue en Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK no esta configurado; se omite el despliegue al hosting."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Despliegue solicitado."
