# Fly.io — despliegue con volumen persistente para la base SQLite. Pasos en docs/despliegue.md.
# Cambia el nombre (debe ser único en todo Fly.io):
app = "dauto-cambia-este-nombre"
primary_region = "qro"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  TRUST_PROXY = "1"
  SEED_DEMO = "true"

# JWT_SECRET, ADMIN_EMAIL y ADMIN_PASSWORD van como secretos (fly secrets set ...), no aquí.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# SQLite vive en un solo archivo: debe haber UNA sola máquina con este volumen.
[[mounts]]
  source = "dauto_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
